  number: k = 10
ctrl:
  title: 'CTRL: A Conditional Transformer Language Model for Controllable Generation'
  authors: Keskar et al.
  venue: arXiv (Salesforce)
  year: 2019
  url: https://arxiv.org/abs/1909.05858
  summary: 'Introduced penalized sampling (the repetition penalty): discount the scores of previously generated tokens.'
  number: greedy decoding with θ ≈ 1.2
minp:
