  authors: PyTorch documentation
  venue: docs.pytorch.org
  year: 2026
  url: https://docs.pytorch.org/docs/stable/notes/cuda.html
  summary: Devices and streams, asynchronous execution, the caching allocator, memory statistics (memory_allocated, max_memory_allocated) and CUDA graphs.
nanogpt:
