  venue: ICLR
  year: 2025
  url: https://arxiv.org/abs/2407.01082
  summary: Min-p keeps tokens whose probability is at least a fraction of the top token's; reports better quality and diversity at high temperature.
  number: threshold = min_p × p_max
minp_critique:
