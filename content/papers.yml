  venue: EMNLP
  year: 2023
  url: https://arxiv.org/abs/2305.14251
  summary: Splits a generation into atomic facts and reports the share supported by a knowledge source; automated estimator for large-scale evaluation.
  number: 'biographies: InstructGPT 42.5%, ChatGPT 58.3%, PerplexityAI 71.5%; ChatGPT 80% → 16% as entities get rarer'
simpleqa:
