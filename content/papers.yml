  year: 2024
  url: https://arxiv.org/abs/2307.13854
  summary: Self-hosted, functional websites (shopping, forums, code hosting, CMS) with tasks graded on functional correctness.
  number: best GPT-4 agent 14.41% vs humans 78.24% (at release)
taubench:
  title: 'τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains'
  authors: Yao et al.
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2406.12045
  summary: Simulated users, domain APIs and policies; grades the final database state and introduces pass^k to measure consistency across trials.
  number: gpt-4o < 50% success; pass^8 < 25% in retail
gaia:
  title: 'GAIA: a benchmark for General AI Assistants'
  authors: Mialon et al.
  venue: ICLR
  year: 2024
  url: https://arxiv.org/abs/2311.12983
  summary: 466 real-world questions that are simple for humans but need reasoning, browsing, multimodality and tool use.
  number: humans 92% vs 15% for GPT-4 with plugins
agentbench:
  title: 'AgentBench: Evaluating LLMs as Agents'
  authors: Liu et al.
  venue: ICLR
  year: 2024
  url: https://arxiv.org/abs/2308.03688
  summary: Eight interactive environments for LLM agents; poor long-term reasoning, decision-making and instruction following are the main failure causes.
greshake:
  title: 'Not what you''ve signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection'
  authors: Greshake et al.
  venue: AISec
  year: 2023
  url: https://arxiv.org/abs/2302.12173
  summary: 'Instructions planted in data the application retrieves (web pages, emails, documents) can hijack LLM-integrated apps: data theft, worming, manipulation.'
agentdojo:
  title: 'AgentDojo: A Dynamic Environment to Evaluate Prompt Injection Attacks and Defenses for LLM Agents'
  authors: Debenedetti et al.
  venue: NeurIPS Datasets and Benchmarks
  year: 2024
  url: https://arxiv.org/abs/2406.13352
  summary: An extensible environment of realistic agent tasks with injected tool outputs to measure attacks and defenses.
  number: 97 tasks, 629 security test cases
bea:
  title: Building effective agents
  authors: Anthropic
  venue: Anthropic Engineering
  year: 2024
  url: https://www.anthropic.com/engineering/building-effective-agents
  summary: 'Workflows (predefined code paths) vs agents (LLMs directing their own process); patterns: prompt chaining, routing, parallelization, orchestrator-workers,
    evaluator-optimizer. Start with the simplest solution.'
ma_research:
  title: How we built our multi-agent research system
  authors: Anthropic
  venue: Anthropic Engineering
  year: 2025
  url: https://www.anthropic.com/engineering/multi-agent-research-system
  summary: A lead agent plans and spawns parallel subagents with separate context windows; lessons on delegation, effort scaling, tools, evaluation and production
    reliability.
  number: +90.2% vs single agent on an internal research eval; ~15× chat tokens
context_eng:
  title: Effective context engineering for AI agents
  authors: Anthropic
  venue: Anthropic Engineering
  year: 2025
  url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
  summary: Context as a finite "attention budget" (context rot); just-in-time retrieval; compaction, structured note-taking and sub-agents for long-horizon tasks.
mcp_spec:
  title: Model Context Protocol specification (revision 2026-07-28)
  authors: MCP maintainers
  venue: modelcontextprotocol.io
  year: 2026
  url: https://modelcontextprotocol.io/specification/2026-07-28
  summary: Hosts, clients and servers over JSON-RPC 2.0; servers offer tools, resources and prompts; stdio and Streamable HTTP transports; stateless requests with
    per-request protocol version and capabilities.
mcp_changes:
  title: MCP specification changelog (2026-07-28)
  authors: MCP maintainers
  venue: modelcontextprotocol.io
  year: 2026
  url: https://modelcontextprotocol.io/specification/2026-07-28/changelog
  summary: Removes the initialize handshake and sessions, adds server/discover and subscriptions/listen, replaces server-initiated requests with multi round-trip
    requests (input_required).
mcp_announce:
  title: Introducing the Model Context Protocol
  authors: Anthropic
  venue: Anthropic
  year: 2024
  url: https://www.anthropic.com/news/model-context-protocol
  summary: Announcement of MCP (November 25, 2024) as a universal, open standard for connecting AI systems to data sources and tools.
ant_tools:
  title: Tool use with Claude (overview)
  authors: Anthropic documentation
  venue: platform.claude.com
  year: 2026
  url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
  summary: Tools defined with input_schema; client tools return stop_reason "tool_use" and are executed by the application, which replies with tool_result; server
    tools run on Anthropic's side.
oai_functions:
  title: Function calling
  authors: OpenAI documentation
  venue: developers.openai.com
  year: 2026
  url: https://developers.openai.com/api/docs/guides/function-calling
  summary: Function tools defined by JSON Schema with optional strict mode, tool_choice (auto, required, forced) and parallel_tool_calls; results returned as function_call_output
    items.
ant_computer:
  title: Computer use tool
  authors: Anthropic documentation
  venue: platform.claude.com
  year: 2026
  url: https://platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool
  summary: Screenshot, mouse and keyboard control in an agent loop; recommends a dedicated VM or container, no sensitive data, a domain allowlist and human confirmation
    for consequential actions.
ant_caching:
  title: Prompt caching
  authors: Anthropic documentation
  venue: platform.claude.com
  year: 2026
  url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  summary: 'Reuse of cached prompt prefixes: 5-minute cache writes cost 1.25× base input, 1-hour writes 2×, and reads 0.1× on most models (lower on some newer ones).'
litellm_routing:
  title: Router - load balancing, fallbacks and retries
  authors: LiteLLM documentation
  venue: docs.litellm.ai
  year: 2026
  url: https://docs.litellm.ai/docs/routing
  summary: 'An open-source gateway router: routing strategies (default simple-shuffle; latency-, cost-, usage-based, least-busy), num_retries with backoff on rate limits, fallbacks to other model groups, and cooldowns (allowed_fails 3, cooldown_time 5 s).'
cf_gateway:
  title: AI Gateway
  authors: Cloudflare documentation
  venue: developers.cloudflare.com
  year: 2026
  url: https://developers.cloudflare.com/ai-gateway/
  summary: 'A managed gateway in front of model providers: analytics, logging, caching, rate limiting, request retry and model fallback.'
ant_ratelimits:
  title: Rate limits
  authors: Anthropic documentation
  venue: platform.claude.com
  year: 2026
  url: https://platform.claude.com/docs/en/api/rate-limits
  summary: 'Limits in requests, input tokens and output tokens per minute (RPM, ITPM, OTPM) per model class, enforced with a token bucket; 429 errors with retry-after; for most models cached input tokens do not count toward ITPM.'
  number: 2M ITPM with an 80% cache hit rate ≈ 10M total input tokens per minute
owasp_llm:
  title: OWASP Top 10 for LLM Applications 2025
  authors: OWASP GenAI Security Project
  venue: genai.owasp.org
  year: 2025
  url: https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
  summary: 'LLM06:2025 Excessive Agency: root causes are excessive functionality, excessive permissions and excessive autonomy; mitigations include minimising extensions and their permissions, executing in the user''s context, user approval and complete mediation.'
routellm:
  title: 'RouteLLM: Learning to Route LLMs with Preference Data'
  authors: Ong et al.
  venue: ICLR
  year: 2025
  url: https://arxiv.org/abs/2406.18665
  summary: Routers trained on human preference data (with augmentation) choose between a strong and a weak model per query; they transfer when the model pair changes.
  number: costs cut by over 2× in some cases without lowering response quality
frugalgpt:
  title: 'FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance'
  authors: Chen, Zaharia & Zou
  venue: TMLR
  year: 2024
  url: https://arxiv.org/abs/2305.05176
  summary: 'Three cost levers (prompt adaptation, LLM approximation, LLM cascade); FrugalGPT learns a cascade that queries cheaper models first and stops when a scorer accepts the answer.'
  number: matches GPT-4 with up to 98% lower cost, or +4% accuracy at the same cost
hybridllm:
  title: 'Hybrid LLM: Cost-Efficient and Quality-Aware Query Routing'
  authors: Ding et al.
  venue: ICLR
  year: 2024
  url: https://arxiv.org/abs/2404.14618
  summary: A router sends each query to a small or large model from its predicted difficulty; the quality level is tunable at test time.
  number: up to 40% fewer calls to the large model with no drop in response quality
mcp_auth:
  title: 'Model Context Protocol: Authorization (revision 2026-07-28)'
  authors: MCP specification
  venue: modelcontextprotocol.io
  year: 2026
  url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
  summary: 'OAuth 2.1 for HTTP transports: servers are resource servers publishing Protected Resource Metadata (RFC 9728); clients use PKCE (S256) and the resource parameter (RFC 8707); servers must validate the token audience and must not pass tokens through; 403 insufficient_scope triggers step-up authorization.'
rfc8693:
  title: OAuth 2.0 Token Exchange (RFC 8693)
  authors: Jones et al.
  venue: IETF
  year: 2020
  url: https://www.rfc-editor.org/rfc/rfc8693
  summary: 'Exchange a subject token (and optional actor token) for a new token; distinguishes impersonation from delegation ("A is an agent for B") and records the acting party in the act claim.'
nist_rbac:
  title: Role Based Access Control
  authors: NIST Computer Security Resource Center
  venue: csrc.nist.gov
  year: 2024
  url: https://csrc.nist.gov/projects/role-based-access-control
  summary: RBAC was formalised by Ferraiolo and Kuhn in 1992; the NIST model became the ANSI/INCITS 359-2004 standard (revised 2012). Users get roles, roles carry permissions.
nist_abac:
  title: Guide to Attribute Based Access Control (ABAC) Definition and Considerations
  authors: Hu et al. (NIST)
  venue: NIST Special Publication 800-162
  year: 2014
  url: https://csrc.nist.gov/pubs/sp/800/162/upd2/final
  summary: Access decisions computed from attributes of the subject, the object, the requested operation and the environment, evaluated against policy.
zanzibar:
  title: "Zanzibar: Google's Consistent, Global Authorization System"
  authors: Pang et al.
  venue: USENIX ATC
  year: 2019
  url: https://www.usenix.org/conference/atc19/presentation/pang
  summary: Relationship-based access control as a service; ACLs stored as relation tuples, checked consistently at global scale.
  number: trillions of ACLs, millions of checks per second, p95 under 10 ms, over 99.999% availability for 3 years
contextual_retrieval:
  title: Introducing Contextual Retrieval
  authors: Anthropic
  venue: Anthropic News
  year: 2024
  url: https://www.anthropic.com/news/contextual-retrieval
  summary: 'Prepend 50-100 tokens of chunk-specific context (written by an LLM from the whole document) before embedding and BM25 indexing; retrieve top 150, rerank, keep 20. Knowledge bases under 200,000 tokens can go straight into the prompt.'
  number: 'top-20 retrieval failures 5.7% → 3.7% (−35%), 2.9% with BM25 (−49%), 1.9% with reranking (−67%); $1.02 per million document tokens'
late_chunking:
  title: 'Late Chunking: Contextual Chunk Embeddings Using Long-Context Embedding Models'
  authors: Günther et al.
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2409.04701
  summary: Embed the whole long text first and pool token embeddings per chunk afterwards, so each chunk embedding carries the surrounding context; no extra training needed.
beir:
  title: 'BEIR: A Heterogenous Benchmark for Zero-shot Evaluation of Information Retrieval Models'
  authors: Thakur et al.
  venue: NeurIPS Datasets and Benchmarks
  year: 2021
  url: https://arxiv.org/abs/2104.08663
  summary: 18 retrieval datasets for zero-shot evaluation; BM25 is a robust baseline, and re-ranking and late-interaction models score best on average at higher compute cost.
mteb:
  title: 'MTEB: Massive Text Embedding Benchmark'
  authors: Muennighoff et al.
  venue: EACL
  year: 2023
  url: https://arxiv.org/abs/2210.07316
  summary: 8 embedding tasks, 58 datasets, 112 languages; no single embedding method dominates across all tasks.
dpr:
  title: Dense Passage Retrieval for Open-Domain Question Answering
  authors: Karpukhin et al.
  venue: EMNLP
  year: 2020
  url: https://arxiv.org/abs/2004.04906
  summary: A dual encoder (separate query and passage encoders) trained on question-passage pairs; retrieval by inner product.
  number: +9 to 19 points top-20 accuracy over Lucene BM25
hnsw:
  title: Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs
  authors: Malkov & Yashunin
  venue: IEEE TPAMI
  year: 2018
  url: https://arxiv.org/abs/1603.09320
  summary: 'A multi-layer proximity graph: each element''s top layer is drawn from an exponentially decaying distribution (mL = 1/ln M), search descends greedily from the top layer, and layer 0 keeps up to 2M links per element; logarithmic complexity scaling.'
pq:
  title: Product Quantization for Nearest Neighbor Search
  authors: Jégou, Douze & Schmid
  venue: IEEE TPAMI
  year: 2011
  url: https://inria.hal.science/inria-00514462
  summary: Split each vector into m subvectors and quantize each with its own small codebook, so a vector is stored as m short codes; distances are estimated from per-query lookup tables (asymmetric distance computation), combined with an inverted file (IVFADC).
diskann:
  title: 'DiskANN: Fast Accurate Billion-point Nearest Neighbor Search on a Single Node'
  authors: Subramanya et al.
  venue: NeurIPS
  year: 2019
  url: https://proceedings.neurips.cc/paper/2019/hash/09853c7fb1d3f8ee67a61b6bf4a7f8e6-Abstract.html
  summary: A graph index (Vamana) stored on SSD with compressed vectors in RAM serves a billion-point index from one workstation.
  number: 1B points, 64 GB RAM, >5,000 queries/s, <3 ms mean latency, 95%+ 1-recall@1 on 16 cores
faiss:
  title: The Faiss library
  authors: Douze et al.
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2401.08281
  summary: 'The vector-search toolkit behind many vector databases: flat, IVF, PQ and graph indexes, and the trade-off space between accuracy, speed, memory and build time.'
scann:
  title: Accelerating Large-Scale Inference with Anisotropic Vector Quantization
  authors: Guo et al.
  venue: ICML
  year: 2020
  url: https://arxiv.org/abs/1908.10396
  summary: 'ScaNN: a quantization loss that penalises the error parallel to the data point more than the orthogonal error, which suits maximum inner product search.'
monobert:
  title: Passage Re-ranking with BERT
  authors: Nogueira & Cho
  venue: arXiv
  year: 2019
  url: https://arxiv.org/abs/1901.04085
  summary: A BERT cross-encoder reads query and passage together and outputs a relevance score; used to rerank BM25 candidates.
  number: +27% relative MRR@10 over the previous state of the art on MS MARCO
colbert:
  title: 'ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT'
  authors: Khattab & Zaharia
  venue: SIGIR
  year: 2020
  url: https://arxiv.org/abs/2004.12832
  summary: 'Late interaction: query and document are encoded separately into token embeddings (documents offline), then scored by summing each query token''s maximum similarity (MaxSim).'
  number: competitive with BERT rerankers, two orders of magnitude faster, four orders fewer FLOPs per query
rankgpt:
  title: 'Is ChatGPT Good at Search? Investigating Large Language Models as Re-Ranking Agents'
  authors: Sun et al.
  venue: EMNLP
  year: 2023
  url: https://arxiv.org/abs/2304.09542
  summary: Listwise reranking by an instructed LLM that outputs a permutation, applied with a sliding window over BM25's top 100; the ranking ability distils into small models.
  number: a distilled 440M model beats a 3B supervised reranker on BEIR
sbert:
  title: 'Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks'
  authors: Reimers & Gurevych
  venue: EMNLP
  year: 2019
  url: https://arxiv.org/abs/1908.10084
  summary: A bi-encoder producing one embedding per sentence, compared by cosine similarity.
  number: most similar pair among 10,000 sentences takes ~65 h with a BERT cross-encoder vs ~5 s with SBERT
rrf:
  title: Reciprocal Rank Fusion outperforms Condorcet and individual Rank Learning Methods
  authors: Cormack, Clarke & Büttcher
  venue: SIGIR
  year: 2009
  url: https://cormack.uwaterloo.ca/cormacksigir09-rrf.pdf
  summary: 'Fuse several rankings by score(d) = Σ 1/(k + rank_r(d)) with k = 60; simple, training-free and better than the individual rankings.'
cohere_rerank:
  title: Rerank overview
  authors: Cohere documentation
  venue: docs.cohere.com
  year: 2026
  url: https://docs.cohere.com/docs/rerank-overview
  summary: A hosted reranker API that orders documents by relevance to a query and returns a relevance score per document; structured documents are best passed as YAML strings.
gorilla:
  title: 'Gorilla: Large Language Model Connected with Massive APIs'
  authors: Patil et al.
  venue: NeurIPS
  year: 2024
  url: https://arxiv.org/abs/2305.15334
  summary: A LLaMA model fine-tuned to write API calls, trained with retrieved API documentation so it adapts to documentation changes at test time; APIBench evaluation.
toolllm:
  title: 'ToolLLM: Facilitating Large Language Models to Master 16000+ Real-world APIs'
  authors: Qin et al.
  venue: ICLR
  year: 2024
  url: https://arxiv.org/abs/2307.16789
  summary: 'ToolBench: 16,464 real REST APIs in 49 categories, instructions and solution paths generated by ChatGPT with a depth-first decision-tree search; ToolLLaMA generalises to unseen APIs.'
swe_rl:
  title: 'SWE-RL: Advancing LLM Reasoning via Reinforcement Learning on Open Software Evolution'
  authors: Wei et al.
  venue: arXiv
  year: 2025
  url: https://arxiv.org/abs/2502.18449
  summary: RL on software-evolution data (issues, pull requests, code changes) with a rule-based reward (similarity to the real patch); RL improved out-of-domain skills where an SFT baseline degraded them.
  number: Llama3-SWE-RL-70B solves 41.0% of SWE-bench Verified
kimi_k2:
  title: 'Kimi K2: Open Agentic Intelligence'
  authors: Kimi Team
  venue: arXiv
  year: 2025
  url: https://arxiv.org/abs/2507.20534
  summary: 'Agentic post-training: a synthesis pipeline (tool specs → agents and rubric-graded tasks → multi-turn trajectories filtered by a judge, plus real sandboxes for code) and joint RL with verifiable rewards and a self-critique rubric reward.'
  number: 3,000+ real MCP tools and 20,000+ synthetic tools; 65.8 on SWE-bench Verified, 66.1 on Tau2-Bench
xgrammar:
  title: 'XGrammar: Flexible and Efficient Structured Generation Engine for Large Language Models'
  authors: Dong et al.
  venue: MLSys
  year: 2025
  url: https://arxiv.org/abs/2411.15100
  summary: 'Constrained decoding with context-free grammars: context-independent tokens are prechecked into masks, only context-dependent tokens are checked at runtime with a persistent stack, and mask computation overlaps GPU work.'
  number: up to 100× faster grammar execution; near-zero overhead end to end
outlines:
  title: Efficient Guided Generation for Large Language Models
  authors: Willard & Louf
  venue: arXiv
  year: 2023
  url: https://arxiv.org/abs/2307.09702
  summary: Guided generation as finite-state-machine transitions with an index over the vocabulary, enforcing regular expressions and grammars (the Outlines library).
format_freely:
  title: Let Me Speak Freely? A Study on the Impact of Format Restrictions on Performance of Large Language Models
  authors: Tam et al.
  venue: EMNLP Industry
  year: 2024
  url: https://arxiv.org/abs/2408.02442
  summary: Format restrictions such as forced JSON can significantly reduce reasoning performance, and stricter constraints degrade it more.
autellix:
  title: 'Autellix: An Efficient Serving Engine for LLM Agents as General Programs'
  authors: Luo et al.
  venue: arXiv
  year: 2025
  url: https://arxiv.org/abs/2502.13965
  summary: Treats agent programs as first-class units; schedulers preempt and prioritise calls using each program's completed calls to avoid head-of-line blocking.
  number: 4-15× higher program throughput at the same latency vs vLLM
parrot:
  title: 'Parrot: Efficient Serving of LLM-based Applications with Semantic Variable'
  authors: Lin et al.
  venue: OSDI
  year: 2024
  url: https://arxiv.org/abs/2405.19888
  summary: Semantic Variables expose the data flow between an application's LLM requests so the service can schedule and share prefixes across them.
  number: up to an order-of-magnitude end-to-end improvement
lc_agents:
  title: Agents (LangChain)
  authors: LangChain documentation
  venue: docs.langchain.com
  year: 2026
  url: https://docs.langchain.com/oss/python/langchain/agents
  summary: 'create_agent: a model calling tools in a loop until the task is complete; models as "provider:model" strings or objects, tools as callables or LangChain tools, system_prompt, response_format, middleware, and memory via a checkpointer and thread_id.'
lc_tools:
  title: Tools (LangChain)
  authors: LangChain documentation
  venue: docs.langchain.com
  year: 2026
  url: https://docs.langchain.com/oss/python/langchain/tools
  summary: The @tool decorator turns a function into a tool whose name, description (docstring) and argument schema (type hints) are sent to the model.
lc_middleware:
  title: Middleware (LangChain)
  authors: LangChain documentation
  venue: docs.langchain.com
  year: 2026
  url: https://docs.langchain.com/oss/python/langchain/middleware
  summary: 'Hooks around the agent loop (before/after agent and model calls, wrappers around model and tool calls) and prebuilt middleware such as summarization, human-in-the-loop approval, call limits, retries, model fallback and PII handling.'
lc_pypi:
  title: langchain 1.4.6 and langgraph 1.2.15 (release pins)
  authors: PyPI
  venue: pypi.org
  year: 2026
  url: https://pypi.org/project/langgraph/1.2.15/
  summary: 'The versions these decks and notebooks are verified against: langchain 1.4.6, langchain-core 1.6.10, langgraph 1.2.15, langgraph-checkpoint 4.3.0.'
lg_overview:
  title: LangGraph overview
  authors: LangChain documentation
  venue: docs.langchain.com
  year: 2026
  url: https://docs.langchain.com/oss/python/langgraph/overview
  summary: A low-level orchestration runtime for long-running, stateful agents, with durable execution, human-in-the-loop, memory and streaming.
lg_graph_api:
  title: Graph API (LangGraph)
  authors: LangChain documentation
  venue: docs.langchain.com
  year: 2026
  url: https://docs.langchain.com/oss/python/langgraph/graph-api
  summary: 'State schemas and reducers (the default overwrites), MessagesState and add_messages, nodes, edges and conditional edges, Send and Command; execution in Pregel-style super-steps that ends when all nodes are inactive.'
pregel:
  title: 'Pregel: A System for Large-Scale Graph Processing'
  authors: Malewicz et al.
  venue: SIGMOD
  year: 2010
  url: https://research.google/pubs/pregel-a-system-for-large-scale-graph-processing/
  summary: 'Vertex-centric computation in synchronous super-steps of message passing; the computation halts when every vertex has voted to halt and no messages are in transit. LangGraph''s runtime is modelled on it.'
lg_persistence:
  title: Persistence (LangGraph)
  authors: LangChain documentation
  venue: docs.langchain.com
  year: 2026
  url: https://docs.langchain.com/oss/python/langgraph/persistence
  summary: Checkpointers save thread-scoped graph state for conversation continuity, human-in-the-loop, time travel and fault tolerance; stores keep application data across threads.
lg_interrupts:
  title: Interrupts (LangGraph)
  authors: LangChain documentation
  venue: docs.langchain.com
  year: 2026
  url: https://docs.langchain.com/oss/python/langgraph/interrupts
  summary: 'interrupt() pauses a run (needs a checkpointer and thread_id); Command(resume=value) continues and the node restarts from the beginning, so code before the interrupt re-runs; no bare try/except around it; keep interrupt order stable.'
lg_streaming:
  title: Streaming (LangGraph)
  authors: LangChain documentation
  venue: docs.langchain.com
  year: 2026
  url: https://docs.langchain.com/oss/python/langgraph/streaming
  summary: 'Stream modes for progress and output: values, updates, messages (tokens), custom, checkpoints, tasks and debug.'
oai_agents_sdk:
  title: OpenAI Agents SDK
  authors: OpenAI documentation
  venue: openai.github.io
  year: 2026
  url: https://openai.github.io/openai-agents-python/
  summary: 'Primitives: agents (LLMs with instructions and tools), handoffs and agents-as-tools for delegation, guardrails for input and output validation; plus sessions and built-in tracing.'
claude_agent_sdk:
  title: Agent SDK overview
  authors: Anthropic documentation
  venue: code.claude.com
  year: 2026
  url: https://code.claude.com/docs/en/agent-sdk/overview
  summary: 'Claude Code as a library: the same tools, agent loop and context management, with hooks, subagents, MCP, permissions and sessions, in Python and TypeScript.'
a2a_spec:
  title: Agent2Agent (A2A) Protocol Specification (v1.0)
  authors: A2A Project
  venue: a2a-protocol.org
  year: 2026
  url: https://a2a-protocol.org/latest/specification/
  summary: 'Agent Cards at /.well-known/agent-card.json; Messages of Parts (exactly one of text, raw, url or data); Tasks with a lifecycle (SUBMITTED, WORKING, INPUT_REQUIRED, AUTH_REQUIRED, COMPLETED, FAILED, CANCELED, REJECTED) producing Artifacts; JSON-RPC, gRPC and HTTP+JSON bindings; streaming over SSE and push notifications. v1.0.0 released 12 March 2026.'
a2a_announce:
  title: 'Announcing the Agent2Agent Protocol (A2A)'
  authors: Google
  venue: Google for Developers Blog
  year: 2025
  url: https://developers.googleblog.com/en/a2a-a-new-era-of-agent-interoperability/
  summary: 'An open protocol for agent-to-agent communication that complements MCP; built on HTTP, SSE and JSON-RPC; secure by default; long-running tasks; modality agnostic.'
  number: announced 9 April 2025 with more than 50 technology partners
a2a_lf:
  title: A2A protocol surpasses 150 organizations, lands in major cloud platforms
  authors: Linux Foundation
  venue: Linux Foundation press release
  year: 2026
  url: https://www.linuxfoundation.org/press/a2a-protocol-surpasses-150-organizations-lands-in-major-cloud-platforms-and-sees-enterprise-production-use-in-first-year
  summary: 'One-year milestone: version 1.0 is the first stable specification; integrations in Azure AI Foundry, Copilot Studio and Amazon Bedrock AgentCore Runtime.'
  number: more than 150 supporting organizations (April 2026)
ant_sandboxing:
  title: 'Beyond permission prompts: making Claude Code more secure and autonomous'
  authors: Anthropic
  venue: Anthropic Engineering
  year: 2025
  url: https://www.anthropic.com/engineering/claude-code-sandboxing
  summary: 'Filesystem and network isolation built on Linux bubblewrap and macOS Seatbelt; egress through a proxy outside the sandbox with allowed domains; in the cloud version credentials stay outside the sandbox and a git proxy attaches the real token.'
  number: sandboxing cut permission prompts by 84% in internal use
firecracker:
  title: 'Firecracker: Lightweight Virtualization for Serverless Applications'
  authors: Agache et al.
  venue: NSDI
  year: 2020
  url: https://www.usenix.org/conference/nsdi20/presentation/agache
  summary: A minimal KVM-based virtual machine monitor for multi-tenant serverless workloads, used by AWS Lambda and Fargate.
  number: '< 125 ms boot, < 5 MiB overhead per microVM, up to 150 microVMs per second per host (firecracker-microvm.github.io)'
gvisor:
  title: gVisor documentation
  authors: gVisor project
  venue: gvisor.dev
  year: 2026
  url: https://gvisor.dev/docs/
  summary: 'An application kernel in user space: the Sentry services system calls without passing them to the host kernel, a Gofer mediates file access, and runsc plugs into Docker and Kubernetes; costs some compatibility and syscall-heavy performance.'
seccomp:
  title: Seccomp BPF (secure computing with filters)
  authors: Linux kernel documentation
  venue: docs.kernel.org
  year: 2026
  url: https://docs.kernel.org/userspace-api/seccomp_filter.html
  summary: A process installs a BPF filter on system calls and their arguments to reduce the kernel attack surface; the docs note system call filtering "isn't a sandbox" by itself.
temporal_workflows:
  title: Temporal Workflows
  authors: Temporal documentation
  venue: docs.temporal.io
  year: 2026
  url: https://docs.temporal.io/workflows
  summary: 'Workflow code is replayed against the recorded event history to rebuild state (no memory snapshots), so it must be deterministic; activities do the side effects and their results are recorded once and reused on replay.'
temporal_retries:
  title: Retry policies (Temporal)
  authors: Temporal documentation
  venue: docs.temporal.io
  year: 2026
  url: https://docs.temporal.io/encyclopedia/retry-policies
  summary: 'Activity defaults: initial interval 1 s, backoff 2.0, maximum interval 100 × initial, unlimited attempts; workflows do not retry by default.'
temporal_limits:
  title: Temporal Workflow Execution limits
  authors: Temporal documentation
  venue: docs.temporal.io
  year: 2026
  url: https://docs.temporal.io/workflow-execution/limits
  summary: Event History is limited to 51,200 events or 50 MB, with warnings after 10,240 events or 10 MB.
airflow:
  title: Apache Airflow documentation (3.x)
  authors: Apache Software Foundation
  venue: airflow.apache.org
  year: 2026
  url: https://airflow.apache.org/docs/apache-airflow/stable/index.html
  summary: 'A platform for developing, scheduling and monitoring workflows defined as Python DAGs; aimed at batch workflows with a clear start and end.'
argo:
  title: Argo Workflows documentation
  authors: Argo Project (CNCF)
  venue: argo-workflows.readthedocs.io
  year: 2026
  url: https://argo-workflows.readthedocs.io/en/latest/
  summary: A container-native workflow engine for Kubernetes implemented as a CRD; each step runs as a container, as steps or a DAG; used for machine-learning pipelines, batch processing, and continuous integration and delivery.
slurm_overview:
  title: Slurm Workload Manager overview
  authors: SchedMD
  venue: slurm.schedmd.com
  year: 2026
  url: https://slurm.schedmd.com/overview.html
  summary: 'Three functions (allocate access to resources, launch and monitor work, arbitrate contention via a queue); slurmctld central manager with optional backup, slurmd on each node, optional slurmdbd accounting; nodes, partitions, jobs and job steps.'
slurm_gres:
  title: Generic Resource (GRES) Scheduling
  authors: SchedMD
  venue: slurm.schedmd.com
  year: 2026
  url: https://slurm.schedmd.com/gres.html
  summary: 'GPUs as GRES (gres.conf, AutoDetect=nvml); --gres=gpu:N per node, --gpus per job, --gpus-per-node/-task; CUDA_VISIBLE_DEVICES set per step; MIG instances as GPUs (pre-partitioned); gres/shard sharing without isolation; nodes with fewer resources than configured are drained.'
slurm_priority:
  title: Multifactor Priority Plugin
  authors: SchedMD
  venue: slurm.schedmd.com
  year: 2026
  url: https://slurm.schedmd.com/priority_multifactor.html
  summary: 'Priority = weighted sum of factors in [0, 1] (age, association, fair-share, job size, partition, QOS, site, TRES) minus nice; every weight defaults to 0; PriorityDecayHalfLife defaults to 7 days; Fair Tree is the default fair-share algorithm since 19.05.'
slurm_fairshare:
  title: Classic Fairshare Algorithm
  authors: SchedMD
  venue: slurm.schedmd.com
  year: 2026
  url: https://slurm.schedmd.com/classic_fair_share.html
  summary: 'F = 2^(−U/S) (refined with effective usage UE through the account tree), with usage decayed by PriorityDecayHalfLife; still available with PriorityFlags=NO_FAIR_TREE.'
slurm_sched:
  title: Scheduling Configuration Guide (Slurm 26.05)
  authors: SchedMD
  venue: slurm.schedmd.com
  year: 2026
  url: https://slurm.schedmd.com/sched_config.html
  summary: 'The main scheduler tests jobs in strict priority order per partition (sched_interval 60 s); backfill starts lower-priority jobs that do not delay higher-priority ones and needs realistic time limits (bf_interval 30 s, bf_window 1,440 min, bf_max_job_test 100, bf_resolution 60 s).'
slurm_topology:
  title: Topology Guide
  authors: SchedMD
  venue: slurm.schedmd.com
  year: 2026
  url: https://slurm.schedmd.com/topology.html
  summary: 'topology/tree (lowest switch that fits, best-fit leaf switches; --switches=count@time), topology/block (fixed-size blocks to reduce fragmentation; --segment), topology/ring (26.05) and topology/torus3d.'
slurm_preempt:
  title: Preemption
  authors: SchedMD
  venue: slurm.schedmd.com
  year: 2026
  url: https://slurm.schedmd.com/preempt.html
  summary: 'PreemptType none / partition_prio / qos; PreemptMode CANCEL, REQUEUE (only with --requeue or JobRequeue=1), SUSPEND (with GANG), GANG (time-slicing jobs in a partition), OFF; GraceTime sends SIGCONT and SIGTERM at once and SIGKILL at the new end time.'
slurm_conf:
  title: slurm.conf and scontrol reference
  authors: SchedMD
  venue: slurm.schedmd.com
  year: 2026
  url: https://slurm.schedmd.com/slurm.conf.html
  summary: 'HealthCheckProgram runs as root on all compute nodes every HealthCheckInterval seconds (0 disables it); JobRequeue=1 (default) lets batch jobs be requeued; the DRAIN state prevents additional jobs from running on a node.'
nvidia_schedmd:
  title: NVIDIA acquires open-source workload management provider SchedMD
  authors: NVIDIA
  venue: NVIDIA Blog
  year: 2025
  url: https://blogs.nvidia.com/blog/nvidia-acquires-schedmd/
  summary: 'NVIDIA acquired SchedMD, Slurm''s main developer, on 15 December 2025 and said it will keep Slurm open-source and vendor-neutral; Slurm runs on more than half of the top 10 and top 100 TOP500 systems.'
k8s_gpus:
  title: Schedule GPUs (Kubernetes)
  authors: Kubernetes documentation
  venue: kubernetes.io
  year: 2026
  url: https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/
  summary: 'Vendor device plugins expose resources such as nvidia.com/gpu; GPUs are specified in limits (requests default to and must equal limits); node labels, selectors and Node Feature Discovery target GPU types.'
k8s_dra:
  title: Dynamic Resource Allocation (Kubernetes)
  authors: Kubernetes documentation
  venue: kubernetes.io
  year: 2026
  url: https://kubernetes.io/docs/concepts/scheduling-eviction/dynamic-resource-allocation/
  summary: 'Stable since v1.35 (first in v1.30): DeviceClasses, ResourceClaims and ResourceSlices; devices can be shared through a claim and filtered with CEL expressions, unlike device plugins with per-container requests.'
kueue_overview:
  title: Kueue overview
  authors: Kubernetes SIG Scheduling
  venue: kueue.sigs.k8s.io
  year: 2026
  url: https://kueue.sigs.k8s.io/docs/overview/
  summary: 'Kubernetes-native job queueing: decides when a job waits, is admitted or is preempted; quotas and fair sharing, resource flavors, admission checks, all-or-nothing scheduling with a timeout, topology-aware scheduling; integrates with Jobs, JobSet, Ray and Kubeflow Trainer.'
kueue_cq:
  title: Cluster Queue (Kueue)
  authors: Kubernetes SIG Scheduling
  venue: kueue.sigs.k8s.io
  year: 2026
  url: https://kueue.sigs.k8s.io/docs/concepts/cluster_queue/
  summary: 'Cluster-scoped quotas per ResourceFlavor (nominalQuota, borrowingLimit, lendingLimit); cohorts share unused quota; StrictFIFO or BestEffortFIFO (default); preemption withinClusterQueue and reclaimWithinCohort default to Never.'
kueue_waitpods:
  title: Setup All-or-nothing with ready Pods (waitForPodsReady)
  authors: Kubernetes SIG Scheduling
  venue: kueue.sigs.k8s.io
  year: 2026
  url: https://kueue.sigs.k8s.io/docs/tasks/manage/setup_wait_for_pods_ready/
  summary: Kueue watches an admitted workload until all its pods are ready; if not within the timeout (default 30 minutes) it is evicted and requeued with exponential backoff (60 s up to 3,600 s), which breaks partial-allocation deadlocks between distributed jobs.
kueue_tas:
  title: Topology Aware Scheduling (Kueue)
  authors: Kubernetes SIG Scheduling
  venue: kueue.sigs.k8s.io
  year: 2026
  url: https://kueue.sigs.k8s.io/docs/concepts/topology_aware_scheduling/
  summary: 'Beta and on by default since Kueue 0.14: a Topology object over node labels (block, rack, node); podset-required-topology keeps all pods in one domain, podset-preferred-topology tries and moves up a level.'
jobset:
  title: JobSet overview
  authors: Kubernetes SIG Apps
  venue: jobset.sigs.k8s.io
  year: 2026
  url: https://jobset.sigs.k8s.io/docs/overview/
  summary: 'A group of Kubernetes Jobs managed as a unit: separate templates per replicated job, the whole set recreated on failure per its failure policy, exclusive placement per topology domain, and a headless service for pod discovery.'
var_bench:
  title: Quantifying Variance in Evaluation Benchmarks
  authors: Madaan et al.
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2406.10229
  summary: 'Ten Llama-2-7B-architecture models trained for 210B tokens that differ only in seed: seed standard deviation ARC-C 0.80, HellaSwag 0.21, GSM8K 0.41, MMLU 0.57, MMLU-Cloze 0.22; gains should exceed seed variance; use cloze formulations for pretraining ablations.'
signal_noise:
  title: 'Signal and Noise: A Framework for Reducing Uncertainty in Language Model Evaluation'
  authors: Heineman et al.
  venue: arXiv
  year: 2025
  url: https://arxiv.org/abs/2508.13144
  summary: 'Signal (relative dispersion of scores across models of similar compute) over noise (relative std of one run''s final checkpoints) predicts small-to-large decision accuracy; perplexity beats accuracy; filtering noisy subtasks and averaging checkpoints help. 30 benchmarks, 375 models from 60M to 32B.'
  number: SNR vs decision accuracy R = 0.791; checkpoint averaging 68.9% → 71.3% decision accuracy (30-task average)
datadecide:
  title: 'DataDecide: How to Predict Best Pretraining Data with Small Experiments'
  authors: Magnusson et al.
  venue: arXiv
  year: 2025
  url: https://arxiv.org/abs/2504.11393
  summary: 'Controlled pretraining over 25 corpora, up to 100B tokens and 1B parameters, 3 seeds: rankings at a single small scale are a strong baseline; no scaling-law method among 8 baselines beats it for the same compute; continuous likelihood metrics make benchmarks highly predictable.'
  number: 150M rankings predict ~80% of 1B comparisons; >80% predictable with 0.01% of the compute
random_search:
  title: Random Search for Hyper-Parameter Optimization
  authors: Bergstra & Bengio
  venue: JMLR
  year: 2012
  url: https://www.jmlr.org/papers/v13/bergstra12a.html
  summary: Randomly chosen trials are more efficient than a grid because only a few hyperparameters really matter, and which ones differ by dataset.
hyperband:
  title: 'Hyperband: A Novel Bandit-Based Approach to Hyperparameter Optimization'
  authors: Li et al.
  venue: JMLR
  year: 2018
  url: https://arxiv.org/abs/1603.06560
  summary: Speeds up random search with adaptive resource allocation and early stopping, framed as a pure-exploration bandit problem.
  number: over an order-of-magnitude speedup over the Bayesian-optimisation competitor set
seed3407:
  title: 'Torch.manual_seed(3407) is all you need: On the influence of random seeds in deep learning architectures for computer vision'
  authors: Picard
  venue: arXiv
  year: 2021
  url: https://arxiv.org/abs/2109.08203
  summary: Scanning up to 10^4 seeds on CIFAR-10 (and fewer on ImageNet) shows it is surprisingly easy to find outlier seeds that perform much better or worse than average.
kohavi_scale:
  title: Online Controlled Experiments at Large Scale
  authors: Kohavi et al.
  venue: KDD
  year: 2013
  url: https://exp-platform.com/large-scale/
  summary: Lessons from running online controlled experiments at Bing scale; many ideas move key metrics by about 1%, so experiments must be sensitive and trustworthy.
  number: over 200 concurrent experiments on any given day, each with millions of users
bing_third:
  title: Large Scale Experimentation at Bing
  authors: Bing Search Quality Insights
  venue: Bing Blogs
  year: 2013
  url: https://blogs.bing.com/search-quality-insights/2013/08/08/large-scale-experimentation-at-bing
  summary: 'Harry Shum (Bing R&D): when ideas are evaluated in controlled experiments, "less than a third move the metrics they were designed to improve".'
cuped:
  title: Improving the Sensitivity of Online Controlled Experiments by Utilizing Pre-Experiment Data
  authors: Deng, Xu, Kohavi & Walker
  venue: WSDM
  year: 2013
  url: https://exp-platform.com/Documents/2013-02-CUPED-ImprovingSensitivityOfControlledExperiments.pdf
  summary: 'CUPED: use each unit''s pre-experiment metric as a covariate to remove explainable variance (a factor 1 − ρ² for correlation ρ).'
  number: about 50% variance reduction at Bing, i.e. the same power with half the users or half the duration
always_valid:
  title: 'Always Valid Inference: Bringing Sequential Analysis to A/B Testing'
  authors: Johari, Pekelis & Walsh
  venue: Operations Research
  year: 2022
  url: https://arxiv.org/abs/1512.04922
  summary: Fixed-horizon p-values are unreliable when users continuously monitor tests and stop when they like; always-valid p-values and confidence intervals stay valid whenever the decision is made. Deployed on a large commercial A/B testing platform.
srm:
  title: 'Diagnosing Sample Ratio Mismatch in Online Controlled Experiments: A Taxonomy and Rules of Thumb for Practitioners'
  authors: Fabijan et al.
  venue: KDD
  year: 2019
  url: https://exp-platform.com/Documents/2019_KDDFabijanGupchupFuptaOmhoverVermeerDmitriev.pdf
  summary: 'An SRM is when the observed sample ratio differs from the expected one; like a fever it is a symptom of many data-quality issues. Taxonomy from four companies and over 25 products.'
interleaving:
  title: Large-Scale Validation and Analysis of Interleaved Search Evaluation
  authors: Chapelle, Joachims, Radlinski & Yue
  venue: ACM TOIS
  year: 2012
  url: https://www.cs.cornell.edu/people/tj/publications/chapelle_etal_12a.pdf
  summary: Interleaving merges two rankings into one list shown to the user and credits clicks to each, a paired online comparison; validated with Yahoo!, Bing and arXiv search data against judgments and other online metrics.
cot:
  title: Chain-of-Thought Prompting Elicits Reasoning in Large Language Models
  authors: Wei et al.
  venue: NeurIPS
  year: 2022
  url: https://arxiv.org/abs/2201.11903
  summary: A few exemplars with intermediate reasoning steps make large models much better at arithmetic, commonsense and symbolic reasoning; the ability emerges around 100B parameters and helps most on multi-step tasks with flat scaling curves.
  number: 'GSM8K: PaLM 540B 18% → 57% with 8 exemplars (prior best 55%)'
zeroshot_cot:
  title: Large Language Models are Zero-Shot Reasoners
  authors: Kojima et al.
  venue: NeurIPS
  year: 2022
  url: https://arxiv.org/abs/2205.11916
  summary: Adding "Let's think step by step" before the answer elicits chain-of-thought reasoning without any exemplars.
  number: 'text-davinci-002: MultiArith 17.7% → 78.7%, GSM8K 10.4% → 40.7%'
gsm8k_verifiers:
  title: Training Verifiers to Solve Math Word Problems
  authors: Cobbe et al.
  venue: arXiv
  year: 2021
  url: https://arxiv.org/abs/2110.14168
  summary: 'Introduces GSM8K (8.5K grade-school math word problems) and trained verifiers: generate many candidate solutions and pick the one the verifier ranks highest; verification scales better with data than a finetuning baseline.'
selfconsistency:
  title: Self-Consistency Improves Chain of Thought Reasoning in Language Models
  authors: Wang et al.
  venue: ICLR
  year: 2023
  url: https://arxiv.org/abs/2203.11171
  summary: Sample diverse reasoning paths and return the most consistent final answer (marginalising over paths) instead of greedy decoding.
  number: GSM8K +17.9, SVAMP +11.0, AQuA +12.2, StrategyQA +6.4, ARC-Challenge +3.9 points
monkeys:
  title: 'Large Language Monkeys: Scaling Inference Compute with Repeated Sampling'
  authors: Brown et al.
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2407.21787
  summary: Coverage (problems solved by any sample) scales with the number of samples over four orders of magnitude, often log-linearly; with automatic verifiers it becomes accuracy, while majority voting and reward models plateau beyond several hundred samples.
  number: 'SWE-bench Lite: 15.9% (1 sample) → 56% (250 samples) vs 43% single-sample state of the art'
prm:
  title: "Let's Verify Step by Step"
  authors: Lightman et al.
  venue: ICLR
  year: 2024
  url: https://arxiv.org/abs/2305.20050
  summary: Process supervision (feedback on each reasoning step) significantly outperforms outcome supervision for training reward models on MATH; active learning improves it further; releases PRM800K.
  number: 78% of a representative MATH test subset; 800,000 step-level labels
snell_ttc:
  title: Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters
  authors: Snell et al.
  venue: ICLR
  year: 2025
  url: https://arxiv.org/abs/2408.03314
  summary: The best way to spend test-time compute (search against process verifiers, or revising responses) depends on prompt difficulty; allocating it adaptively per prompt is compute-optimal.
  number: over 4× more efficient than best-of-N; FLOPs-matched, beats a 14× larger model where the small model has non-trivial success
s1:
  title: 's1: Simple test-time scaling'
  authors: Muennighoff et al.
  venue: arXiv
  year: 2025
  url: https://arxiv.org/abs/2501.19393
  summary: 'Supervised finetuning of Qwen2.5-32B-Instruct on 1,000 curated reasoning traces (s1K) plus budget forcing: end thinking at a budget, or append "Wait" to extend it so the model double-checks its answer.'
  number: s1-32B beats o1-preview by up to 27% (MATH, AIME24); AIME24 50% → 57% with budget forcing
overthinking:
  title: 'Do NOT Think That Much for 2+3=? On the Overthinking of o1-Like LLMs'
  authors: Chen et al.
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2412.21187
  summary: o1-like models allocate excessive compute to simple problems with minimal benefit; efficiency metrics and self-training strategies reduce overhead without hurting accuracy.
cot_faithful:
  title: "Reasoning Models Don't Always Say What They Think"
  authors: Chen et al. (Anthropic)
  venue: arXiv
  year: 2025
  url: https://arxiv.org/abs/2505.05410
  summary: Reasoning models often use hints without mentioning them; outcome-based RL improves faithfulness then plateaus, and increased reward hacking is not verbalised more. CoT monitoring helps but cannot rule out rare bad behaviour.
  number: 'faithfulness: 25% Claude 3.7 Sonnet, 39% DeepSeek R1'
claude_thinking:
  title: Extended and adaptive thinking (Claude API)
  authors: Anthropic documentation
  venue: platform.claude.com
  year: 2026
  url: https://platform.claude.com/docs/en/build-with-claude/extended-thinking
  summary: 'Manual budgets (thinking.type enabled, budget_tokens ≥ 1,024) on older models; newer models use adaptive thinking with an effort level, and reject fixed budgets; thinking tokens are billed output (usage.output_tokens_details.thinking_tokens); batch processing above 32k thinking tokens.'
toy_superposition:
  title: Toy Models of Superposition
  authors: Elhage et al. (Anthropic)
  venue: Transformer Circuits Thread
  year: 2022
  url: https://arxiv.org/abs/2209.10652
  summary: 'Polysemanticity arises when models store more sparse features than dimensions in superposition; with dense features a toy model keeps only the most important (like PCA), with sparse features it packs more (e.g. five in two dimensions), with phase changes, polytope geometry and a link to adversarial examples.'
induction_heads:
  title: In-context Learning and Induction Heads
  authors: Olsson et al. (Anthropic)
  venue: Transformer Circuits Thread
  year: 2022
  url: https://arxiv.org/abs/2209.11895
  summary: 'Induction heads complete [A][B] ... [A] → [B]; they form at the same point as a sharp rise in in-context learning (a bump in the training loss); causal evidence in small attention-only models, correlational in larger ones.'
mono_features:
  title: 'Towards Monosemanticity: Decomposing Language Models With Dictionary Learning'
  authors: Bricken et al. (Anthropic)
  venue: Transformer Circuits Thread
  year: 2023
  url: https://transformer-circuits.pub/2023/monosemantic-features/index.html
  summary: 'Sparse autoencoders on the 512-neuron MLP of a one-layer transformer, trained on 8 billion activations, with 512 to 131,072 features (analysis on 4,096); features for Arabic script, DNA, base64 and Hebrew; a single neuron mixes academic citations, English dialogue, HTTP requests and Korean text.'
sae_cunningham:
  title: Sparse Autoencoders Find Highly Interpretable Features in Language Models
  authors: Cunningham et al.
  venue: ICLR
  year: 2024
  url: https://arxiv.org/abs/2309.08600
  summary: SAE features are more interpretable and monosemantic than alternative decompositions, and pinpoint the features causally responsible for indirect-object identification more finely.
scaling_mono:
  title: 'Scaling Monosemanticity: Extracting Interpretable Features from Claude 3 Sonnet'
  authors: Templeton et al. (Anthropic)
  venue: Transformer Circuits Thread
  year: 2024
  url: https://transformer-circuits.pub/2024/scaling-monosemanticity/index.html
  summary: 'SAEs on the middle-layer residual stream of Claude 3 Sonnet with ~1M, ~4M and ~34M features; fewer than 300 active per token, at least 65% of variance explained; multilingual and multimodal features; safety-relevant features (code backdoors, bias, deception, power-seeking, sycophancy); feature clamping steers behaviour.'
  number: dead features ≈2% (1M), 35% (4M), 65% (34M)
golden_gate:
  title: Golden Gate Claude
  authors: Anthropic
  venue: Anthropic News
  year: 2024
  url: https://www.anthropic.com/news/golden-gate-claude
  summary: Amplifying the Golden Gate Bridge feature in Claude 3 Sonnet made most replies mention the bridge; available as a 24-hour research demo.
sae_openai:
  title: Scaling and evaluating sparse autoencoders
  authors: Gao et al. (OpenAI)
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2406.04093
  summary: k-sparse (top-k) autoencoders control sparsity directly and, with other changes, leave few dead latents; clean scaling laws in size and sparsity; new feature-quality metrics.
  number: a 16 million latent SAE on GPT-4 activations, trained on 40 billion tokens
gemma_scope:
  title: 'Gemma Scope: Open Sparse Autoencoders Everywhere All At Once on Gemma 2'
  authors: Lieberum et al. (Google DeepMind)
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2408.05147
  summary: Open JumpReLU SAEs trained on all layers and sub-layers of Gemma 2 2B and 9B (and select layers of 27B).
ioi:
  title: 'Interpretability in the Wild: a Circuit for Indirect Object Identification in GPT-2 small'
  authors: Wang et al.
  venue: ICLR
  year: 2023
  url: https://arxiv.org/abs/2211.00593
  summary: A circuit of 26 attention heads in 7 classes, found with causal interventions and evaluated for faithfulness, completeness and minimality.
rome:
  title: Locating and Editing Factual Associations in GPT
  authors: Meng et al.
  venue: NeurIPS
  year: 2022
  url: https://arxiv.org/abs/2202.05262
  summary: Causal tracing finds factual recall in mid-layer feed-forward modules at subject tokens; Rank-One Model Editing (ROME) updates a fact by modifying those weights.
attribution_graphs:
  title: On the Biology of a Large Language Model
  authors: Lindsey et al. (Anthropic)
  venue: Transformer Circuits Thread
  year: 2025
  url: https://transformer-circuits.pub/2025/attribution-graphs/biology.html
  summary: 'Attribution graphs on a replacement model of Claude 3.5 Haiku: multi-hop reasoning (Dallas → Texas → Austin) alongside shortcuts, planning rhymes ahead, shared multilingual circuits; satisfying insight for about a quarter of prompts tried.'
actadd:
  title: Steering Language Models With Activation Engineering
  authors: Turner et al.
  venue: arXiv
  year: 2023
  url: https://arxiv.org/abs/2308.10248
