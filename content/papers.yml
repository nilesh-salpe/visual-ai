  venue: arXiv
  year: 2025
  url: https://arxiv.org/abs/2506.13681
  summary: 'Re-analysis of the min-p paper''s human, benchmark and LLM-judge evidence: min-p does not outperform baseline samplers when hyperparameters are controlled.'
  number: no improvement over top-p, top-k or basic sampling
vllm_sampling:
