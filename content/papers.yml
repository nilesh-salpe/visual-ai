  venue: arXiv (OpenAI)
  year: 2025
  url: https://arxiv.org/abs/2509.04664
  summary: Hallucinations arise as ordinary classification errors (at least the singleton rate for arbitrary facts) and persist because binary-graded benchmarks reward
    guessing; proposes explicit confidence targets with penalty t/(1 − t).
  number: answer only if confidence > t; errors cost t/(1 − t) points
halluc_survey:
  title: 'A Survey on Hallucination in Large Language Models: Principles, Taxonomy, Challenges, and Open Questions'
