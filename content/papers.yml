  venue: ACM TOIS
  year: 2025
  url: https://arxiv.org/abs/2311.05232
  summary: 'Taxonomy: factuality hallucination (factual inconsistency, fabrication) vs faithfulness hallucination (instruction, context and logical inconsistency);
    causes, detection and mitigation.'
  number: 'two primary types: factuality and faithfulness'
truthfulqa:
