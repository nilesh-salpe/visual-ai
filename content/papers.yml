  venue: ICLR
  year: 2023
  url: https://arxiv.org/abs/2302.09664
  summary: Clusters sampled answers by meaning with bidirectional entailment and computes entropy over meanings; more predictive of QA accuracy than token-level baselines.
  number: unsupervised; one off-the-shelf model
know_what_they_know:
