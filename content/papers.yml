vaswani:
  title: Attention Is All You Need
  authors: Vaswani et al.
  venue: NeurIPS
  year: 2017
  url: https://arxiv.org/abs/1706.03762
  summary: 'The Transformer: attention-only encoder-decoder with post-norm residual blocks, sinusoidal positions and a ReLU FFN (feed-forward network). The baseline
    every later change is measured against.'
  number: 28.4 BLEU on WMT 2014 English-German
gpt2:
  title: Language Models are Unsupervised Multitask Learners (GPT-2)
  authors: Radford et al.
  venue: OpenAI
  year: 2019
  url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
  summary: Decoder-only language model that moved layer normalization to the input of each sub-block (pre-norm) and added a final norm.
  number: context 1,024 tokens, vocabulary 50,257
llama:
  title: 'LLaMA: Open and Efficient Foundation Language Models'
