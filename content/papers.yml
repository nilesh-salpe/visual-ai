  number: beats Flamingo-80B by 8.7% on zero-shot VQAv2 with 54× fewer trainable parameters
chameleon:
  title: 'Chameleon: Mixed-Modal Early-Fusion Foundation Models'
  authors: Chameleon Team (Meta)
  venue: arXiv
  year: 2024
  url: https://arxiv.org/abs/2405.09818
  summary: Early-fusion, token-based model that understands and generates images and text in any order within one sequence.
claude_vision:
  title: Vision (Claude API)
  authors: Anthropic documentation
  venue: platform.claude.com
  year: 2026
  url: https://platform.claude.com/docs/en/build-with-claude/vision
