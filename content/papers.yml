  authors: Kadavath et al.
  venue: arXiv (Anthropic)
  year: 2022
  url: https://arxiv.org/abs/2207.05221
  summary: Larger models are well calibrated on multiple-choice and true/false questions in the right format; models can estimate P(True) for their own answers and
