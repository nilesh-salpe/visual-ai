pt_compile:
  title: torch.compiler
  authors: PyTorch documentation
  venue: docs.pytorch.org
  year: 2026
  url: https://docs.pytorch.org/docs/stable/torch.compiler.html
  summary: 'Overview of torch.compile: TorchDynamo graph capture, AOTAutograd, the Inductor backend, compile modes and troubleshooting graph breaks.'
pt_sdpa:
  title: (Beta) Implementing High-Performance Transformers with Scaled Dot Product Attention
  authors: PyTorch documentation
  venue: docs.pytorch.org
  year: 2026
