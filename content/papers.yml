  venue: ACL
  year: 2022
  url: https://arxiv.org/abs/2109.07958
  summary: Questions some people answer falsely because of misconceptions; larger models were generally less truthful.
  number: 817 questions, 38 categories; best model 58% truthful vs 94% human
factscore:
