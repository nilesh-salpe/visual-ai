  venue: arXiv
  year: 2023
  url: https://arxiv.org/abs/2302.13971
  summary: 'The recipe most open models followed: pre-normalization with RMSNorm, SwiGLU with a ⅔·4d hidden size, and rotary embeddings.'
  number: trained on 1.0–1.4T tokens
llama2:
  title: 'Llama 2: Open Foundation and Fine-Tuned Chat Models'
  authors: Touvron et al.
  venue: arXiv
  year: 2023
  url: https://arxiv.org/abs/2307.09288
