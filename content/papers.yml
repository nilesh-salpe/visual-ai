  venue: arXiv (OpenAI)
  year: 2024
  url: https://arxiv.org/abs/2411.04368
  summary: Short fact-seeking questions with one indisputable answer, collected adversarially against GPT-4o; graded correct, incorrect or not attempted.
  number: 4,326 questions; GPT-4o 38.2% correct / 60.8% incorrect; Claude 3.5 Sonnet 28.9% / 36.1% with 35.0% not attempted
selfcheckgpt:
  title: 'SelfCheckGPT: Zero-Resource Black-Box Hallucination Detection for Generative Large Language Models'
  authors: Manakul, Liusie, Gales
  venue: EMNLP
  year: 2023
  url: https://arxiv.org/abs/2303.08896
