  number: models acquire new facts through pretraining, mostly not fine-tuning
claude_reduce_halluc:
  title: Reduce hallucinations (Claude documentation)
  authors: Anthropic
  venue: Claude platform docs
  year: 2026
  url: https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations
  summary: Allow "I don't know", extract word-for-word quotes first for documents over 20k tokens, require citations and retract unsupported claims, compare several
    runs.
  number: quote-first grounding for long documents (>20k tokens)
topk_fan:
  title: Hierarchical Neural Story Generation
  authors: Fan, Lewis, Dauphin
  venue: ACL
  year: 2018
  url: https://arxiv.org/abs/1805.04833
