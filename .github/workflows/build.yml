name: Build site from content/

on:
  push:
    branches: [main]
    paths: ['content/**', 'shared/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Build decks, indexes, glossary, reading lists and hub maps
        run: |
          python tools/build_decks.py
          python tools/build_indexes.py
          python tools/build_home.py
          python tools/build_site_extras.py
          python tools/review_status.py --write > /dev/null
          python tools/add_analytics.py
      - name: Acronym lint
        run: python tools/decks/acronyms.py lint */[0-9][0-9]-*/index.html
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' build-it/README.md
          git diff --cached --quiet || (git commit -m "Rebuild site from content/" && git push)
